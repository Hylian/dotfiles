# Global & Per-Host Colorscheme Selection
# Precedence in templates:
#   1. Local override in ~/.config/chezmoi/chezmoi.toml ([data] colorscheme = "...")
#   2. Host mapping in [host_colorschemes] below
#   3. Fallback to default_colorscheme
default_colorscheme = "everforest-light"

[host_colorschemes]
shined = "natsu-hiru"
eterna = "everforest-light"
shined-mac = "natsu-hiru"
baumkuchen = "everforest-light"
midnight-future = "everforest-light"

# ==============================================================================
# Named Colorscheme Definitions
# ==============================================================================

[colorschemes.everforest-light]
name = "everforest-light"
appearance = "light"
zellij_theme = "everforest-light"
delta_syntax_theme = "OneHalfLight"
bat_theme = "OneHalfLight"
tuicr_theme = "everforest-light"

[colorschemes.everforest-light.palette]
# Base backgrounds & surfaces
bg0 = "#fffbef"            # Primary window & terminal background (warm cream)
bg_bar = "#fffbef"         # Statusbar / deadcolumn blend background
bg1 = "#f8f5e4"            # Soft cream surface (inactive tab pill)
bg2 = "#f3f5d9"            # Subtle highlight (FZF bg+, ANSI 7, cursorline)
bg3 = "#efebd4"            # Medium muted background
bg4 = "#e5dfc5"            # Softest contrast background
bg_visual = "#e5e8c5"      # Vi-mode visual selection highlight (sage)
bg_red = "#fceced"         # Soft blush pink (active tab pill, deadcolumn warning)
bg_blue = "#ecf5ed"        # Soft blue-green wash
bg_yellow = "#fef2d5"      # Soft golden wash

# Foregrounds & neutrals
fg = "#5c6a72"             # Primary charcoal text
fg_reverse = "#f2efdf"     # Light badge text on colored statusline ribbons
grey0 = "#829181"          # Muted grey (ANSI 0, comments, inactive borders)
grey1 = "#a6b0a0"          # Light muted sage grey (ANSI 8)
grey2 = "#bec5b2"          # Subtle secondary text (inactive tab fg)

# Semantic & ANSI normal accents (1-6)
red = "#f85552"            # ANSI 1: Errors, LOCKED mode badge, FZF pointers/matches
orange = "#f57d26"         # Constants, warnings
yellow = "#dfa000"         # ANSI 3: Golden ochre, FZF headers
green = "#8da101"          # ANSI 2: Primary accent (NORMAL mode, borders, host ribbon)
moss = "#93b259"           # Soft moss green (window borders)
aqua = "#35a77c"           # ANSI 6: Seafoam cyan, FZF info
blue = "#3a94c5"           # ANSI 4: Sky slate blue, session ribbon
purple = "#df69ba"         # ANSI 5: Blossom magenta, git branch ribbon

# Explicit ANSI normal extremes (0 & 7)
ansi_black = "#829181"     # ANSI 0
ansi_white = "#f3f5d9"     # ANSI 7

# Bright ANSI accents (8-15)
br_black = "#a6b0a0"       # ANSI 8
br_red = "#fa8987"         # ANSI 9, FZF hl+
br_green = "#bbd411"       # ANSI 10
br_yellow = "#f2cd6d"      # ANSI 11
br_blue = "#8fcff2"        # ANSI 12
br_purple = "#f7c1e6"      # ANSI 13
br_aqua = "#85e6c1"        # ANSI 14
br_white = "#fdffe8"       # ANSI 15

# Terminal selection & diff highlights
sel_fg = "#d3c6aa"
sel_bg = "#1e2326"
tab_active_bg = "#fceced"
tab_active_fg = "#5c6a72"
diff_add = "#f3f5d9"
diff_add_emph = "#d7dea4"
diff_del = "#ffe7de"
diff_del_emph = "#f4bfb9"

